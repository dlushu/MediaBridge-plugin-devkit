<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>__PLUGIN_NAME__ 设置</title>
  <!-- 面板插件 UI SDK：唯一稳定入口，见 framework/contracts/plugin-webui.md -->
  <link rel="stylesheet" href="/sdk/plugin-ui.css" />
  <script src="/sdk/plugin-ui.js" defer></script>
</head>
<body>
  <div class="card">
    <h3 style="margin:0">__PLUGIN_NAME__</h3>
    <div class="row">
      <label for="baseUrl">服务地址</label>
      <input id="baseUrl" class="input" placeholder="http://…" />
    </div>
    <div class="row">
      <button class="btn btn-primary" id="save">保存</button>
      <span class="note" id="msg"></span>
    </div>
  </div>
  <script>
    // 通道前缀：页面在 /api/plugins/<类型>/<id>/ui/<入口>，切掉 /ui/… 再拼 /api
    // （不能写 fetch('./api/xxx') —— 会落到静态文件路，见 plugin-webui.md 第三节）
    const API = location.pathname.replace(/\/ui\/.*$/, '') + '/api';

    async function load() {
      const r = await fetch(API + '/settings');
      const s = await r.json();
      document.getElementById('baseUrl').value = s.baseUrl || '';
    }
    document.getElementById('save').onclick = async () => {
      const r = await fetch(API + '/save', {
        method: 'POST',
        body: JSON.stringify({ baseUrl: document.getElementById('baseUrl').value.trim() }),
      });
      document.getElementById('msg').textContent = r.ok ? '已保存' : '保存失败';
    };
    load();
  </script>
</body>
</html>
