<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>__PLUGIN_NAME__ 设置</title>
  <!-- 面板插件 UI SDK：唯一稳定入口，见 framework/contracts/plugin-webui.md -->
  <link rel="stylesheet" href="/sdk/plugin-ui.css" />
  <script src="/sdk/plugin-ui.js" defer></script>
</head>
<body>
  <!-- ① 连接 / 通用：对外地址等，改完点保存 -->
  <div class="card">
    <h3 style="margin:0 0 10px">连接</h3>
    <div class="row">
      <label for="baseUrl">对外地址</label>
      <input id="baseUrl" class="input" data-key="baseUrl" placeholder="https://…（外部播放器访问用）" />
    </div>
    <div class="row">
      <button class="btn btn-primary" id="save">保存</button>
      <span class="note" id="msg"></span>
    </div>
  </div>

  <!-- ② 类型专属：安全与门禁 -->
  <div class="card" style="margin-top:12px">
    <h3 style="margin:0 0 10px">安全</h3>
    <div class="note" style="margin-bottom:10px">
      对外入口的鉴权在 <code>plugin.json</code> 的 <code>ingress</code> 声明：<code>public</code>（匿名）/
      <code>token</code>（外部访问令牌）；不声明则两条路径都要面板登录。下面一项是占位。
    </div>
    <div class="row">
      <label for="externalToken">外部访问令牌</label>
      <input id="externalToken" class="input" data-key="externalToken" placeholder="由面板生成（mbp_…）" />
    </div>
  </div>

  <!-- ③ 使用说明 -->
  <div class="card" style="margin-top:12px">
    <h3 style="margin:0 0 10px">使用说明</h3>
    <div class="note">
      <ul style="margin:0;padding-left:18px">
        <li><b>令牌绝不编进产物或下载 URL</b>：匿名产物里只放"怎么填令牌"的说明（铁律）。</li>
        <li>本插件的 <code>http</code> 既服务面板 webui 通道，也提供对外 HTTP 面；按 <code>path</code> 区分。</li>
        <li>hostCall 白名单之外一律 <code>NO_HOSTCALL</code>；失败码按总契约第四节映射成 HTTP 状态。</li>
        <li>契约见 <code>framework/contracts/contract-output.md</code>。</li>
      </ul>
    </div>
  </div>

  <script>
    // 通道前缀：页面在 /api/plugins/<类型>/<id>/ui/<入口>，切掉 /ui/… 再拼 /api
    // （不能写 fetch('./api/xxx') —— 会落到静态文件路，见 plugin-webui.md 第三节）
    const API = location.pathname.replace(/\/ui\/.*$/, '') + '/api';
    // 所有带 data-key 的控件自动读写：key 即设置字段名
    const fields = () => Array.from(document.querySelectorAll('[data-key]'));

    async function load() {
      try {
        const s = await (await fetch(API + '/settings')).json();
        fields().forEach((el) => {
          if (s[el.dataset.key] == null) return;
          if (el.type === 'checkbox') el.checked = !!s[el.dataset.key];
          else el.value = s[el.dataset.key];
        });
      } catch {}
    }
    document.getElementById('save').onclick = async () => {
      const data = {};
      fields().forEach((el) => { data[el.dataset.key] = el.type === 'checkbox' ? el.checked : el.value.trim(); });
      const r = await fetch(API + '/save', { method: 'POST', body: JSON.stringify(data) });
      document.getElementById('msg').textContent = r.ok ? '已保存' : '保存失败';
    };
    load();
  </script>
</body>
</html>
